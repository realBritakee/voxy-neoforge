name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] Describe your feature"
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-request
    attributes:
      label: Description
      description: What feature would you like to see? Why would it be useful?
      placeholder: Describe the feature request in detail.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: Optional — describe any alternatives.
